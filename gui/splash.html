<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luminous Tech</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at 50% 40%, #131c31 0%, #090d16 65%, #05070c 100%);
    color: #f1f5f9;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
  }

  .splash-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 420px;
    padding: 30px;
    position: relative;
    z-index: 10;
  }

  /* Logo with pulsing glow */
  .logo-wrapper {
    position: relative;
    width: 88px;
    height: 88px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-glow {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.45) 0%, rgba(139, 92, 246, 0.25) 50%, transparent 70%);
    filter: blur(12px);
    animation: pulseGlow 2.5s infinite alternate ease-in-out;
  }

  .splash-logo {
    width: 72px;
    height: 72px;
    object-fit: contain;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
    animation: floatLogo 3s ease-in-out infinite;
  }

  /* Brand Typography */
  .splash-title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.6px;
    background: linear-gradient(135deg, #ffffff 30%, #93c5fd 70%, #60a5fa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }

  .splash-subtitle {
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 28px;
    letter-spacing: 0.2px;
  }

  /* Spinner */
  .spinner-box {
    position: relative;
    width: 44px;
    height: 44px;
    margin-bottom: 20px;
  }

  .spinner-ring {
    box-sizing: border-box;
    position: absolute;
    width: 100%;
    height: 100%;
    border: 3px solid transparent;
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
  }

  .spinner-ring-inner {
    box-sizing: border-box;
    position: absolute;
    width: 72%;
    height: 72%;
    top: 14%;
    left: 14%;
    border: 2px solid transparent;
    border-top-color: #8b5cf6;
    border-radius: 50%;
    animation: spinReverse 1.4s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
  }

  /* Status message */
  .splash-status {
    font-size: 13px;
    font-weight: 500;
    color: #cbd5e1;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Progress Bar */
  .progress-track {
    width: 260px;
    height: 4px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    position: absolute;
    height: 100%;
    width: 40%;
    background: linear-gradient(90deg, transparent, #3b82f6, #8b5cf6, transparent);
    border-radius: 3px;
    animation: shimmer 1.8s infinite ease-in-out;
  }

  /* Window Controls Bar for drag */
  #window-controls {
    position: fixed;
    top: 0;
    right: 0;
    display: flex;
    -webkit-app-region: no-drag;
    z-index: 9999;
  }

  .win-btn {
    width: 44px;
    height: 32px;
    border: none;
    background: transparent;
    color: #94a3b8;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s;
  }

  .win-btn:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
  .win-btn.close:hover { background: #ef4444; color: #fff; }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  @keyframes spinReverse {
    0% { transform: rotate(360deg); }
    100% { transform: rotate(0deg); }
  }

  @keyframes pulseGlow {
    0% { transform: scale(0.9); opacity: 0.5; }
    100% { transform: scale(1.15); opacity: 0.85; }
  }

  @keyframes floatLogo {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  @keyframes shimmer {
    0% { left: -40%; }
    100% { left: 100%; }
  }
</style>
</head>
<body>
<div id="window-controls">
  <button class="win-btn" id="win-min" title="Minimize">
    <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 5h8" stroke="currentColor" stroke-width="1.2"/></svg>
  </button>
  <button class="win-btn close" id="win-close" title="Close">
    <svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 2l6 6m0-6l-6 6" stroke="currentColor" stroke-width="1.2"/></svg>
  </button>
</div>

<div class="splash-container">
  <div class="logo-wrapper">
    <div class="logo-glow"></div>
    <img src="app-icon.png" class="splash-logo" alt="Luminous Tech" draggable="false">
  </div>

  <div class="splash-title">Luminous Tech</div>
  <div class="splash-subtitle">Facebook All-in-One Automation</div>

  <div class="spinner-box">
    <div class="spinner-ring"></div>
    <div class="spinner-ring-inner"></div>
  </div>

  <div id="status-label" class="splash-status">Starting automation engine…</div>

  <div class="progress-track">
    <div class="progress-fill"></div>
  </div>
</div>

<script>
  if (window.fsApp?.windowControl) {
    document.getElementById('win-min')?.addEventListener('click', () => window.fsApp.windowControl('minimize'));
    document.getElementById('win-close')?.addEventListener('click', () => window.fsApp.windowControl('close'));
  }
  const statusTexts = [
    'Starting automation engine…',
    'Initializing profile workspace…',
    'Preparing Facebook browser sessions…',
    'Loading modules…'
  ];
  let idx = 0;
  setInterval(() => {
    idx = (idx + 1) % statusTexts.length;
    const el = document.getElementById('status-label');
    if (el) el.textContent = statusTexts[idx];
  }, 1200);
</script>
</body>
</html>
